<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#78c6ff" />
    <link rel="icon" href="data:," />
    <title>Block Pals</title>
    <style>
      /* The loading picture: shown from the very first paint while the world is made (no words, nothing dark). */
      #loading { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; gap: 48px;
        background: #78c6ff; transition: opacity 0.4s ease; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .load-block { width: 120px; height: 120px; border-radius: 14px; background: linear-gradient(#6cc04a 0 34%, #a8743f 34% 100%);
        box-shadow: inset 0 -10px 0 #946232, 0 10px 0 rgba(40, 90, 140, 0.25); animation: load-spin 1.6s ease-in-out infinite; }
      #loading .load-pip { position: relative; width: 132px; height: 112px; border-radius: 50% 50% 46% 46%; background: #ff9a3c;
        animation: load-bob 1.6s ease-in-out infinite; }
      #loading .load-pip::before, #loading .load-pip::after { content: ''; position: absolute; top: -30px; width: 0; height: 0;
        border-left: 26px solid transparent; border-right: 26px solid transparent; border-bottom: 46px solid #ff9a3c; }
      #loading .load-pip::before { left: 4px; transform: rotate(-14deg); }
      #loading .load-pip::after { right: 4px; transform: rotate(14deg); }
      #loading .load-face { position: absolute; left: 22px; right: 22px; bottom: 6px; height: 54px; border-radius: 50%; background: #fff6e8; }
      #loading .load-eye { position: absolute; top: 34px; width: 16px; height: 18px; border-radius: 50%; background: #4a3426; }
      #loading .load-eye.l { left: 34px; } #loading .load-eye.r { right: 34px; }
      #loading .load-nose { position: absolute; left: 56px; bottom: 30px; width: 20px; height: 14px; border-radius: 50%; background: #5a3a2a; }
      @keyframes load-spin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(0.9); } 100% { transform: rotate(360deg) scale(1); } }
      @keyframes load-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @media (prefers-reduced-motion: reduce) { #loading .load-block, #loading .load-pip { animation-duration: 4s; } }
    </style>
  </head>
  <body>
    <div id="loading" aria-hidden="true"><div class="load-block"></div><div class="load-pip"><div class="load-face"></div><div class="load-eye l"></div><div class="load-eye r"></div><div class="load-nose"></div></div></div>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
